name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and restart on VPS
    runs-on: ubuntu-latest
    environment: nahero-vps
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/nahero/nahero-front
            git pull --ff-only
              docker build -t nahero-front .
              docker stop nahero-front || true
              docker rm nahero-front || true
              docker run -d \
                --name nahero-front \
                --restart unless-stopped \
                -p 127.0.0.1:3000:3000 \
                --env-file .env.docker \
                nahero-front
              docker image prune -f
