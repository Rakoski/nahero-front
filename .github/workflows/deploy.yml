name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/rakoski/nahero-front

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL_JAVA=${{ vars.NEXT_PUBLIC_API_URL_JAVA }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_GA_ID=${{ vars.NEXT_PUBLIC_GA_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Restart on VPS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nahero-vps
    permissions:
      packages: read
    steps:
      - name: Pull and restart over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ env.IMAGE }}:${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          command_timeout: 10m
          envs: GHCR_USER,GHCR_TOKEN,IMAGE_REF
          script: |
            set -euo pipefail
            cd ~/nahero/nahero-front
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE_REF"
            docker logout ghcr.io
            docker stop nahero-front || true
            docker rm nahero-front || true
            docker run -d \
              --name nahero-front \
              --restart unless-stopped \
              -p 127.0.0.1:3000:3000 \
              --env-file .env.docker \
              "$IMAGE_REF"
            docker image prune -af --filter "until=168h"
